<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain AI Dashboard</title>
<style>
  :root {
    --bg: #0f172a; --fg: #e2e8f0; --card: #1e293b; --accent: #38bdf8;
    --muted: #94a3b8; --ok: #4ade80; --line: #334155; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
  .status { font-size: .85rem; color: var(--muted); }
  main { max-width: 980px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; font-weight: 700; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; text-align: center;
  }
  .card .value { font-size: 1.5rem; font-weight: 700; }
  .card .label { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .panel { margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .panel input[type=text] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #0f172a; color: var(--fg); font-size: 1rem; font-family: inherit;
  }
  .panel button {
    margin-top: 10px; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--accent); color: #071220; font-weight: 600; font-size: 1rem;
  }
  .panel button:disabled { opacity: .6; cursor: wait; }
  #out {
    margin-top: 14px; min-height: 70px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .95rem; background: #0f172a; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; white-space: pre-wrap; color: var(--ok);
  }
  #err { margin-top: 10px; color: #f87171; font-size: .9rem; }
  @media (max-width: 600px) {
    header { padding: 10px; }
    main { padding: 14px; }
  }
</style>
</head>
<body>
<header>
  <div><span class="brand">Brain AI</span> Dashboard</div>
  <div class="status" id="status">Loading model info…</div>
</header>
<main>
  <h1>Brain AI — Mixture of Experts model</h1>
  <div class="grid" id="stats"></div>
  <div class="panel">
    <h2>Generate with the Brain AI model</h2>
    <input type="text" id="prompt" placeholder="def fizzbuzz(n):" autofocus>
    <button id="btn">Generate</button>
    <div id="out"></div>
    <div id="err"></div>
  </div>
</main>
<script>
(async () => {
  const stats = document.getElementById('stats');
  const btn = document.getElementById('btn');
  const out = document.getElementById('out');
  const err = document.getElementById('err');
  const status = document.getElementById('status');
  const prompt = document.getElementById('prompt');
  const show = (k, v) =>
    `<div class="card"><div class="value">${v}</div><div class="label">${k}</div></div>`;
  try {
    const r = await fetch('/models');
    const m = await r.json();
    stats.innerHTML = [
      show('Params', m.params.toLocaleString()),
      show('Experts', m.experts),
      show('Top-k', m.topk),
      show('Layers', m.layers),
      show('Vocab', m.vocab),
    ].join('');
    status.textContent = 'Brain AI model ready.';
  } catch (e) {
    status.textContent = 'model info unavailable';
  }
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    err.textContent = '';
    try {
      const body = { prompt: prompt.value || 'def fizzbuzz(n):', n: 24 };
      const r = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const d = await r.json();
      out.textContent = (body.prompt) + d.text;
    } catch (e) {
      out.textContent = '';
      err.textContent = 'generation error — is the backend running?';
    }
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
